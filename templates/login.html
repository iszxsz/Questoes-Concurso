{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="card card-estreito">
    <h1>Entrar</h1>

    <form method="post" action="/login">
        <div class="form-grupo">
            <label class="rotulo" for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required>
        </div>

        <div class="form-grupo">
            <label class="rotulo" for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn">Entrar</button>
    </form>

    <p class="rodape-card">Ainda não tem conta? <a href="/cadastro">Criar conta</a></p>
</div>
{% endblock %}
