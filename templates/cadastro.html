{% extends "base.html" %}

{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
<div class="card card-estreito">
    <h1>Criar conta</h1>

    <form method="post" action="/cadastro">
        <div class="form-grupo">
            <label class="rotulo" for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ nome }}" autocomplete="name" required>
        </div>

        <div class="form-grupo">
            <label class="rotulo" for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required>
        </div>

        <div class="form-grupo">
            <label class="rotulo" for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="6" autocomplete="new-password" required>
            <p class="ajuda">Pelo menos 6 caracteres.</p>
        </div>

        <div class="form-grupo">
            <label class="rotulo" for="confirmar_senha">Confirmar senha</label>
            <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="6" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn">Criar conta</button>
    </form>

    <p class="rodape-card">Já tem conta? <a href="/login">Entrar</a></p>
</div>
{% endblock %}
